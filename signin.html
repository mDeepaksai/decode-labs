<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Sign In</title>
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="#">StackFind</a></li>
            <li>
                <div class="hambuger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </li>
        </ul>
        <div class="nav-menu" id="nav-menu">
            <a href="index.html">Home</a>
            <a href="submittool.html">Submit Tool</a>
            <a href="signin.html">Sign In</a>
        </div>
    </nav>
    <div class="main">
        <div class="signin-container">
            <div class="signin-header">
                <h1 class="head">Welcome back</h1>
                <p class="para">Sign in to your StackFind account</p>
            </div>
            <div class="social-signin">
                <button href="#" class="signin-btn1"><i class="fa-brands fa-google"></i>Continue with Google</button>
                <button href="#" class="signin-btn1"><i class="fa-brands fa-github"></i>Continue with GitHub</button>
                <p class="or">or CONTINUE WITH EMAIL</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="you@example.com" id="email">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••" id="password">
                </div>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button class="submit-btn" onclick="handleSignIn()">Sign In</button>

            <p class="switch-link">
                Don't have an account? <a href="#">Create one</a>
            </p>

        </div>
    </div>
    <footer>&copy; 2026 StackFind. All rights reserved.</footer>
    <script src="siginin.js"></script>
</body>

</html>
